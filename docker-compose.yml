services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rum
      POSTGRES_PASSWORD: rum
      POSTGRES_DB: rum
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rum -d rum']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
